- name: functions
  hosts: local
  connection: local
  vars:
    technologies: Devops, Linux, Shell, Ansible #string
    #dictionary == map
    tags:
      Application: Payment
      Environment: Dev 
    #list
    listTags:
    - key: Application
      value: Payment
    - key: Environment
      value: Dev   
  tasks:
  - name: default variable
    ansible.builtin.debug:
      msg: "Hello, {{ Name | default('Sindhu') }}" #default is an inbuilt function in ansible

#string to list
  - name: convert string to list
    ansible.builtin.debug:
      msg: "Technologies are: {{technologies | split(',')}}"

  - name: convert map to list    
    ansible.builtin.debug:
      msg: "Tags are : {{tags | dict2items }}"

  - name: convert map to list    
    ansible.builtin.debug:
      msg: "Tags are : {{listTags | items2dict }}"