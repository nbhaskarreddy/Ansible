- name: install package
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: installing packages
    ansible.builtin.package:
      name: "{{ item.name }}"
      state: "{{ item.state }}"
    loop:  
    - {name: "nginx", state: "latest"}
    - {name: "mysql", state: "absent"}
    - {name: "zip", state: "latest"}